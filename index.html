<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Libro de Ruta - Stage Pirineos 2026 | Mazarete Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0d; }
        .font-title { font-family: 'Space Grotesk', sans-serif; }
        .text-race-yellow { color: #fff200; }
        .bg-race-yellow { background-color: #fff200; }
        .border-race-yellow { border-color: #fff200; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col pb-32">

    <header class="relative overflow-hidden bg-[#141414] border-b border-zinc-800 py-10 px-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-black text-white font-title italic">MAZARETE <span class="text-race-yellow">TEAM</span></h1>
            <p class="text-zinc-400 font-semibold mt-2">🏔️ Pirineos Stage 2026</p>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 mt-8 flex-grow">
        
        <section id="home" class="block space-y-8">
            <h2 class="text-2xl font-black text-white text-center">STAGE PIRINEOS 2026</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="navTo(1)" class="bg-[#141414] border border-zinc-800 p-4 rounded-2xl hover:border-race-yellow transition-all text-left">
                    <img src="image1.png" class="w-full h-32 object-cover rounded mb-4">
                    <h3 class="font-black">DÍA 1: LOS CIRCOS</h3>
                </button>
                <button onclick="navTo(2)" class="bg-[#141414] border border-zinc-800 p-4 rounded-2xl hover:border-race-yellow transition-all text-left">
                    <img src="image10.png" class="w-full h-32 object-cover rounded mb-4">
                    <h3 class="font-black">DÍA 2: EL ALTAR</h3>
                </button>
                </div>
        </section>

        <div id="page-1" class="hidden space-y-8">
            <button onclick="navTo(0)" class="text-race-yellow font-bold underline">← Volver al inicio</button>
            <h2 class="text-3xl font-black">DÍA 1: LOS CIRCOS</h2>
            </div>

        <div id="page-2" class="hidden space-y-8">
            <button onclick="navTo(0)" class="text-race-yellow font-bold underline">← Volver al inicio</button>
            <h2 class="text-3xl font-black">DÍA 2: EL ALTAR</h2>
            </div>
    </main>

    <script>
        lucide.createIcons();

        function navTo(pageNumber) {
            const sections = ['home', 'page-1', 'page-2', 'page-3', 'page-4'];
            
            sections.forEach((id, index) => {
                const el = document.getElementById(id);
                if (!el) return;
                
                if (index === pageNumber) {
                    el.classList.remove('hidden');
                    el.classList.add('block');
                } else {
                    el.classList.remove('block');
                    el.classList.add('hidden');
                }
            });
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
